[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 110

[lint]
# Public immutables are part of the ABI (`messageFee()`, `feeRecipient()`), so they keep camelCase names.
exclude_lints = ["screaming-snake-case-immutable"]
